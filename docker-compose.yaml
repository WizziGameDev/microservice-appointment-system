version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgresql_patient
    restart: always
    environment:
      POSTGRES_DB: db_service_patient
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1212
    ports:
      - "5431:5432"
    volumes:
      - postgres_data_patient:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    container_name: redis_patient
    restart: always
    ports:
      - "6378:6379"
    volumes:
      - redis_data_patient:/data

volumes:
  postgres_data_patient:
  redis_data_patient:
