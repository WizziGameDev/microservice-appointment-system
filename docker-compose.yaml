version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgresql_appointments
    restart: always
    environment:
      POSTGRES_DB: db_service_appointments
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1212
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_appointments:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    container_name: redis_appointments
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data_appointments:/data

volumes:
  postgres_data_appointments:
  redis_data_appointments:
