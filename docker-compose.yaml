version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgresql_doctor
    restart: always
    environment:
      POSTGRES_DB: db_service_doctor
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1212
    ports:
      - "5430:5432"
    volumes:
      - postgres_data_doctor:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    container_name: redis_doctor
    restart: always
    ports:
      - "6377:6379"
    volumes:
      - redis_data_doctor:/data

volumes:
  postgres_data_doctor:
  redis_data_doctor:
