spring.application.name=doctor-service

server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5430/db_service_doctor
spring.datasource.username=admin
spring.datasource.password=admin1212
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Config
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPoolDoctor

spring.flyway.enabled=true
flyway.url=jdbc:postgresql://localhost:5430/db_service_doctor
flyway.user=admin
flyway.password=admin1212

spring.data.redis.host=localhost
spring.data.redis.port=6377
spring.data.redis.timeout=60000

# Log for redis
logging.level.org.springframework.cache.*=trace

# Logging Levels
#logging.level.org.springframework=INFO
#logging.level.org.springframework.web=DEBUG

# Debugging database
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Query Sql
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.use_sql_comments=true

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8084/eureka