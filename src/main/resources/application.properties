spring.application.name=patient-service

server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5431/db_service_patient
spring.datasource.username=admin
spring.datasource.password=admin1212
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Config
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPoolPatient

spring.flyway.enabled=true
flyway.url=jdbc:postgresql://localhost:5431/db_service_patient
flyway.user=admin
flyway.password=admin1212

spring.data.redis.host=localhost
spring.data.redis.port=6378
spring.data.redis.timeout=60000

logging.level.org.springframework.cache.*=trace